org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G
android.useAndroidX=true
# Older FlutterFire plugins (firebase_* 4.x/11.x) still declare buildConfigField in
# defaultConfig. AGP 8 turns BuildConfig generation off by default, so re-enable it
# for every module or :cloud_firestore fails to configure.
android.defaults.buildfeatures.buildconfig=true

# The Flutter engine jars on storage.googleapis.com are slow to fetch here (~18s each),
# which blows Gradle's stock 30s timeouts. Widen them and retry on connection resets.
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=1000
